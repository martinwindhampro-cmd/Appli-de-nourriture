<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes repas</title>
<meta name="description" content="Mon stock, mes recettes, mon planning et mon suivi nutritionnel">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mes repas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #F5F3EE; --card: #FFFFFF; --soft: #F0EDE6; --soft2: #E8E4DA; --ink: #1B1F1D; --mute: #6B716D; --line: #E7E3DA;
  --acc: #1F7A5C; --acc-d: #17604A; --acc-s: #E3F1EA; --acc-t: #FFFFFF;
  --ok: #1F7A5C; --ok-s: #E3F1EA; --warn: #A15C00; --warn-s: #FFF1DC; --bad: #C23B22; --bad-s: #FDE9E4;
  --kcal: #1F7A5C; --p: #D9822B; --g: #3B7DD8; --l: #A855C7;
  --hero-l: 88%; --hero-s: 70%;
  --shadow: 0 1px 2px rgba(40,30,10,.05), 0 4px 14px rgba(40,30,10,.05);
  --r: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --card: #1B201E; --soft: #232A27; --soft2: #2C3430; --ink: #E9EEEB; --mute: #9BA6A0; --line: #29312D;
    --acc: #4CC79A; --acc-d: #7DDBB8; --acc-s: #173328; --acc-t: #08261B;
    --ok: #4CC79A; --ok-s: #173328; --warn: #F2B24C; --warn-s: #33270F; --bad: #F2795F; --bad-s: #3A1A13;
    --kcal: #4CC79A; --p: #F0A15A; --g: #6FA5F0; --l: #CB8BE3;
    --hero-l: 24%; --hero-s: 30%;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --card: #1B201E; --soft: #232A27; --soft2: #2C3430; --ink: #E9EEEB; --mute: #9BA6A0; --line: #29312D;
  --acc: #4CC79A; --acc-d: #7DDBB8; --acc-s: #173328; --acc-t: #08261B;
  --ok: #4CC79A; --ok-s: #173328; --warn: #F2B24C; --warn-s: #33270F; --bad: #F2795F; --bad-s: #3A1A13;
  --kcal: #4CC79A; --p: #F0A15A; --g: #6FA5F0; --l: #CB8BE3;
  --hero-l: 24%; --hero-s: 30%;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--acc); }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px calc(100px + env(safe-area-inset-bottom)); }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(12px + env(safe-area-inset-top)) 0 10px; display: flex; align-items: center; gap: 10px; }
header.top h1 { font-size: 24px; margin: 0; flex: 1; letter-spacing: -.02em; font-weight: 800; }
.sync { font-size: 12px; color: var(--mute); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); }
.dot.on { background: var(--ok); } .dot.busy { background: var(--warn); } .dot.bad { background: var(--bad); }

/* Barre d'onglets */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .in { display: flex; width: 100%; max-width: 760px; }
nav.tabs button { flex: 1; background: none; border: 0; padding: 8px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--mute); }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--acc); }
nav.tabs button.on svg { stroke-width: 2.4; }
.fab { position: fixed; right: max(16px, calc(50% - 364px)); bottom: calc(78px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 20px; background: var(--acc); color: var(--acc-t); font-size: 30px; line-height: 1; border: 0; box-shadow: 0 8px 24px rgba(20,60,40,.28); z-index: 9; }

/* Bases */
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); }
.card.tight { padding: 6px 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.mute { color: var(--mute); } .small { font-size: 13px; } .tiny { font-size: 12px; } .center { text-align: center; }
.num { font-variant-numeric: tabular-nums; }
.clamp1 { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
h2 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
h3 { font-size: 15px; margin: 0 0 8px; }
.sec-h { display: flex; align-items: center; gap: 8px; margin: 22px 2px 10px; }
.sec-h h2 { flex: 1; }
.count { font-size: 12px; font-weight: 600; color: var(--mute); background: var(--soft); border-radius: 99px; padding: 1px 8px; vertical-align: 2px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 11px 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; justify-content: center; min-height: 44px; }
.btn.pri { background: var(--acc); border-color: var(--acc); color: var(--acc-t); }
.btn.pri:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: none; border-color: transparent; color: var(--acc); }
.btn.danger, .link.danger { color: var(--bad); }
.btn.full { width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 13px; min-height: 36px; border-radius: 11px; }
.link { background: none; border: 0; color: var(--acc); font-weight: 600; font-size: 13px; padding: 4px 2px; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: inline-flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; flex: none; }
.icon-btn.ghost { border-color: transparent; background: transparent; color: var(--mute); }
.icon-btn:disabled { opacity: .35; }
input[type=text], input[type=number], input[type=email], input[type=password], input[type=search], select, textarea {
  width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 13px; background: var(--card); outline: none; min-width: 0; font-size: 16px;
}
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-s); }
input:disabled { background: var(--soft); color: var(--mute); }
.big-in { font-size: 20px; font-weight: 700; }
label.f { display: block; font-size: 13px; font-weight: 600; color: var(--mute); margin: 14px 0 6px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin-top: 12px; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--acc); flex: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grid4 input { padding: 10px 4px; text-align: center; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.sheet .chips { margin: 0; padding-left: 0; padding-right: 0; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0; padding: 2px 0 8px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); padding: 8px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.emo { font-size: 20px; padding: 4px 8px; }
.chip .cnt { opacity: .6; font-weight: 500; }
.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--mute); white-space: nowrap; }
.badge.ok { background: var(--ok-s); color: var(--ok); }
.badge.warn { background: var(--warn-s); color: var(--warn); }
.badge.bad { background: var(--bad-s); color: var(--bad); }
.pill { background: var(--bad); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 6px; margin-left: 4px; }
.seg { display: flex; background: var(--soft); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 6px; border-radius: 11px; font-size: 14px; font-weight: 600; color: var(--mute); min-width: 0; }
.seg button.on { background: var(--card); box-shadow: var(--shadow); color: var(--ink); }
.persons { display: inline-flex; align-items: center; background: var(--soft); border-radius: 13px; flex: none; }
.persons button { width: 36px; height: 38px; border: 0; background: none; font-size: 20px; color: var(--ink); }
.persons span { min-width: 34px; text-align: center; font-weight: 700; font-size: 14px; }
.persons.big button { width: 48px; height: 44px; }
.empty { text-align: center; color: var(--mute); padding: 26px 14px; }
.empty b { color: var(--ink); display: block; margin: 6px 0; font-size: 16px; }
.banner { background: var(--warn-s); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; }
.banner .link { color: inherit; text-decoration: underline; display: block; margin-top: 4px; padding: 0; }
.chev { color: var(--mute); font-size: 22px; }
.cta-card { display: flex; align-items: center; gap: 12px; cursor: pointer; }

/* Tuiles emoji */
.tile { width: 46px; height: 46px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 25px; background: var(--soft); flex: none; line-height: 1; }
.tile[style*="--h"] { background: hsl(var(--h) var(--hero-s) var(--hero-l)); }
.tile.sm { width: 38px; height: 38px; font-size: 20px; border-radius: 11px; }
.tile.xs { width: 26px; height: 26px; font-size: 15px; border-radius: 8px; }

/* Accueil */
.daynav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.daynav .t { flex: 1; text-align: center; font-weight: 700; }
.daynav .t .link { display: block; margin: 0 auto; }
.summary { display: flex; align-items: center; gap: 18px; }
.ring-wrap { position: relative; width: 112px; height: 112px; flex: none; }
.ring circle:last-child { transition: stroke-dashoffset .6s ease; }
.ring-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-c b { font-size: 24px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ring-c span { font-size: 11px; color: var(--mute); line-height: 1.2; max-width: 70px; }
.mac { margin-bottom: 8px; }
.mac .k { font-size: 12px; font-weight: 600; color: var(--mute); }
.mac .n { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mac .n .mute { font-weight: 500; }
.bar { height: 7px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; border-radius: 99px; transition: width .5s ease; }
.entry { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.meal-h { padding: 8px 0 6px; font-size: 14px; }
.carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 10px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.carousel > * { flex: 0 0 170px; scroll-snap-align: start; }
.box-c { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; box-shadow: var(--shadow); font-size: 14px; }

/* Cartes recettes */
.rgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 640px) { .rgrid { grid-template-columns: repeat(3, 1fr); } }
.rc { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; transition: transform .12s; }
.rc:active { transform: scale(.98); }
.rc .hero { height: 92px; display: flex; align-items: center; justify-content: center; font-size: 48px; background: hsl(var(--h) var(--hero-s) var(--hero-l)); position: relative; }
.rc .fav { position: absolute; top: 8px; right: 10px; font-size: 16px; color: var(--bad); }
.rc-b { padding: 10px 12px 12px; display: flex; flex-direction: column; flex: 1; }
.rc-t { font-weight: 700; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.rc-m { font-size: 12px; color: var(--mute); margin-top: 4px; }
.rc-m b { color: var(--p); }
.rc-s { margin-top: 8px; margin-top: auto; padding-top: 8px; }
.rc-s .badge { max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: inline-block; }

/* Planning */
.day-card.is-today { border-color: var(--acc); }
.day-h { padding: 10px 0 4px; }
.slot { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; min-height: 56px; }
.day-h + .slot, .card > .slot:first-child { border-top: 0; }
.slot-l { width: 40px; font-size: 12px; font-weight: 700; color: var(--mute); flex: none; }
.slot-empty { flex: 1; border: 1.5px dashed var(--soft2); background: none; border-radius: 13px; padding: 11px; color: var(--mute); font-weight: 600; font-size: 14px; }
.slot.done { opacity: .6; }
.slot b { font-size: 14px; }

/* Courses */
.shop-i { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
.meal-h + .shop-i { border-top: 0; }
.shop-i input { width: 22px; height: 22px; accent-color: var(--acc); flex: none; margin: 0; }
.shop-i.checked .nm { text-decoration: line-through; color: var(--mute); }
.shop-i.checked .tile { opacity: .5; }

/* Stock */
.srow { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); }
.srow:first-child { border-top: 0; }
.srow-m { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
.srow .nm { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .qty { font-size: 13px; }
.level { height: 4px; background: var(--soft); border-radius: 9px; margin-top: 6px; overflow: hidden; max-width: 160px; }
.level > i { display: block; height: 100%; border-radius: 9px; background: var(--ok); }
.level.lg { height: 8px; max-width: none; margin-top: 12px; }
.stepper2 { display: flex; background: var(--soft); border-radius: 13px; flex: none; }
.stepper2 button { width: 42px; height: 40px; border: 0; background: none; font-size: 20px; font-weight: 600; color: var(--ink); }
.stepper2 button:first-child { border-right: 1px solid var(--line); }
.qty-hero { background: var(--soft); border-radius: 16px; padding: 16px; text-align: center; margin-bottom: 4px; }
.qty-hero b { font-size: 28px; letter-spacing: -.02em; display: block; }
.qty-hero span { color: var(--mute); font-size: 14px; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quick button { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 13px 8px; font-weight: 600; font-size: 14px; }
.quick button.danger { color: var(--bad); }

/* Profil */
.goals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.goal { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 6px; font-weight: 600; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.goal span { font-size: 24px; }
.goal.on { border-color: var(--acc); background: var(--acc-s); color: var(--acc-d); }
.targets > div { text-align: center; }
.targets input { font-weight: 700; color: var(--c); border-color: color-mix(in srgb, var(--c) 30%, var(--line)); }

/* Fiches */
.backdrop { position: fixed; inset: 0; background: rgba(10,15,12,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out; }
.backdrop.no-anim, .backdrop.no-anim .sheet { animation: none; }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--bg); width: 100%; max-width: 760px; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain; border-radius: 24px 24px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .22s cubic-bezier(.2,.9,.3,1); }
@keyframes up { from { transform: translateY(40px); } }
.sheet .grab { width: 40px; height: 5px; border-radius: 99px; background: var(--soft2); margin: 4px auto 10px; }
.sheet-h { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.sheet-h h2 { flex: 1; font-size: 19px; }
.results { margin-top: 6px; }
.res { padding: 9px 6px; border-radius: 12px; cursor: pointer; display: flex; gap: 12px; align-items: center; }
.res:hover { background: var(--soft); }
.res b { font-size: 14px; }
.r-hero { height: 150px; margin: -8px -16px 0; border-radius: 24px 24px 0 0; display: flex; align-items: center; justify-content: center; font-size: 76px; background: hsl(var(--h) var(--hero-s) var(--hero-l)); position: relative; }
.r-close { position: absolute; top: 10px; right: 10px; background: color-mix(in srgb, var(--card) 70%, transparent) !important; color: var(--ink) !important; }
.r-fav { position: absolute; top: 10px; left: 10px; background: color-mix(in srgb, var(--card) 70%, transparent) !important; color: var(--bad) !important; font-size: 20px; }
.r-title { font-size: 22px; margin: 14px 0 8px; letter-spacing: -.02em; }
.macro-card { display: flex; align-items: center; gap: 16px; }
.macro-big b { font-size: 26px; display: block; letter-spacing: -.02em; }
.macro-big span { font-size: 12px; color: var(--mute); }
.stack { display: flex; height: 10px; border-radius: 99px; overflow: hidden; gap: 2px; }
.stack i { display: block; height: 100%; }
.ing-line { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); align-items: center; font-size: 14px; }
.ing-line:first-of-type { border-top: 0; }
.ico { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; font-weight: 700; }
.ico.ok { background: var(--ok-s); color: var(--ok); } .ico.no { background: var(--bad-s); color: var(--bad); } .ico.base { background: var(--soft); color: var(--mute); }
ol.steps { padding-left: 20px; margin: 6px 0 0; } ol.steps li { margin-bottom: 8px; }
.sheet-actions { display: flex; gap: 8px; position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom)); background: var(--bg); padding: 10px 0 4px; }
.list-actions { display: flex; flex-direction: column; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; z-index: 40; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: up .2s; }
.toast-undo { background: none; border: 0; color: var(--acc-d); font-weight: 800; padding: 0; }
@media (prefers-color-scheme: light) { .toast-undo { color: #7DDBB8; } }
.login { max-width: 400px; margin: 6vh auto 0; }
.login-hero { font-size: 64px; text-align: center; }
.login h2 { font-size: 26px; margin: 6px 0 4px; }
@media (min-width: 640px) { .backdrop { align-items: center; } .sheet { border-radius: 24px; max-height: 88vh; } .r-hero { border-radius: 24px 24px 0 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">Mes repas</h1>
    <div class="sync" id="sync"></div>
  </header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Ajouter ce que j'ai mangé" hidden>+</button>
<nav class="tabs" id="tabs"></nav>
<div id="sheet-root"></div>
<script src="data.js"></script>
<script src="ticket.js"></script>
