<style>
:root {
  --bg: #F4F6F5; --card: #FFFFFF; --soft: #EEF2F1; --ink: #13201D; --mute: #5E6B68; --line: #E1E7E5;
  --acc: #0F766E; --acc-d: #0B5E58; --acc-s: #E0F2EF; --acc-t: #FFFFFF;
  --ok: #047857; --ok-s: #E7F6EF; --warn: #8A4B00; --warn-s: #FFF4E5; --bad: #B42318; --bad-s: #FDECEA;
  --kcal: #0F766E; --p: #B45309; --g: #2563EB; --l: #9333EA;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1513; --card: #16201E; --soft: #1D2927; --ink: #E7EFED; --mute: #9AA9A5; --line: #26332F;
    --acc: #2DD4BF; --acc-d: #5EEAD4; --acc-s: #12312D; --acc-t: #062420;
    --ok: #34D399; --ok-s: #0F2A21; --warn: #FBBF24; --warn-s: #2E2410; --bad: #F87171; --bad-s: #321716;
    --kcal: #2DD4BF; --p: #F59E0B; --g: #60A5FA; --l: #C084FC;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1513; --card: #16201E; --soft: #1D2927; --ink: #E7EFED; --mute: #9AA9A5; --line: #26332F;
  --acc: #2DD4BF; --acc-d: #5EEAD4; --acc-s: #12312D; --acc-t: #062420;
  --ok: #34D399; --ok-s: #0F2A21; --warn: #FBBF24; --warn-s: #2E2410; --bad: #F87171; --bad-s: #321716;
  --kcal: #2DD4BF; --p: #F59E0B; --g: #60A5FA; --l: #C084FC;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--acc); }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 0 10px; display: flex; align-items: center; gap: 10px; }
header.top h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: -.01em; }
.sync { font-size: 12px; color: var(--mute); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); }
.dot.on { background: var(--ok); } .dot.busy { background: var(--warn); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .in { display: flex; width: 100%; max-width: 720px; }
nav.tabs button { flex: 1; background: none; border: 0; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--mute); cursor: pointer; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--acc); font-weight: 600; }

.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; border: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.mute { color: var(--mute); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
h2 { font-size: 16px; margin: 18px 0 8px; }
h3 { font-size: 15px; margin: 0 0 6px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.btn.pri { background: var(--acc); border-color: var(--acc); color: var(--acc-t); }
.btn.pri:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: none; border-color: transparent; color: var(--acc); padding: 6px 8px; }
.btn.danger { color: var(--bad); }
.btn.full { width: 100%; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; flex: none; }
input[type=text], input[type=number], input[type=email], input[type=password], input[type=search], select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); outline: none; min-width: 0;
}
input:focus, select:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-s); }
label.f { display: block; font-size: 13px; color: var(--mute); margin: 10px 0 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grid4 input { padding: 10px 4px; text-align: center; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--acc); border-color: var(--acc); color: var(--acc-t); }
.badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--mute); white-space: nowrap; }
.badge.ok { background: var(--ok-s); color: var(--ok); }
.badge.warn { background: var(--warn-s); color: var(--warn); }
.badge.bad { background: var(--bad-s); color: var(--bad); }
.seg { display: flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.seg button.on { background: var(--card); box-shadow: var(--shadow); font-weight: 600; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper b { min-width: 24px; text-align: center; }
.empty { text-align: center; color: var(--mute); padding: 26px 10px; }

/* Aujourd'hui */
.daynav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.daynav .t { flex: 1; text-align: center; font-weight: 600; }
.kcal-big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.kcal-big .v { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; border-radius: 99px; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
.macros .k { font-size: 12px; color: var(--mute); }
.macros .n { font-weight: 600; font-variant-numeric: tabular-nums; }
.entry { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.entry:first-of-type { border-top: 0; }
.num { font-variant-numeric: tabular-nums; }

/* Stock */
.item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .name { cursor: pointer; }
.place-h { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; }
.place-h h3 { margin: 0; flex: 1; }

/* Recettes */
.rcard { cursor: pointer; }
.rcard .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.miss { color: var(--warn); font-size: 13px; margin-top: 6px; }
.ing-line { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); align-items: center; }
.ing-line:first-child { border-top: 0; }
.ico { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex: none; }
.ico.ok { background: var(--ok-s); color: var(--ok); }
.ico.no { background: var(--bad-s); color: var(--bad); }
.ico.base { background: var(--soft); color: var(--mute); }
ol.steps { padding-left: 20px; margin: 6px 0 0; }
ol.steps li { margin-bottom: 6px; }

/* Fiche (bottom sheet) */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 720px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(30px); } to { transform: none; } }
.sheet .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 4px auto 10px; }
.sheet-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sheet-h h2 { margin: 0; flex: 1; font-size: 18px; }
.results { max-height: 42vh; overflow-y: auto; }
.res { padding: 10px 4px; border-top: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: center; }
.res:hover { background: var(--soft); }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 40; font-size: 14px; max-width: calc(100% - 32px); }
.login { max-width: 380px; margin: 10vh auto 0; }
.banner { background: var(--warn-s); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
@media (min-width: 640px) { .backdrop { align-items: center; } .sheet { border-radius: 18px; max-height: 86vh; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">Aujourd'hui</h1>
    <div class="sync" id="sync"></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Aujourd'hui</button>
  <button data-tab="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M5 10h14M9 6v1M9 13v3"/></svg>Stock</button>
  <button data-tab="recipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-2 1-3M12 7c0-1.5 1-2 1-3M16 7c0-1.5 1-2 1-3"/></svg>Recettes</button>
  <button data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profil</button>
</div></nav>
<div id="sheet-root"></div>

<script>
'use strict';
/* =====================================================================
   MES REPAS — stock, recettes et suivi nutritionnel
   Organisation :
     1. Firebase (facultatif)   4. Calculs (stock, recettes, nutrition)
     2. Outils                  5. Écrans : Aujourd'hui · Stock · Recettes · Profil
     3. Données & sauvegarde    6. Fiches · 7. Démarrage
   ===================================================================== */

/* ============================== 1. FIREBASE ==============================
   Laisse FIREBASE_CONFIG à null pour utiliser l'appli en local (données sur cet appareil).
   Pour synchroniser téléphone et ordinateur : crée un projet Firebase, active
   « Authentication → E-mail/Mot de passe » et « Firestore », puis colle ici la config web. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAqfrPS3L3XvrP3Jmt5urtewjsU1pm6rj8",
  authDomain: "appli-de-suivis-repas.firebaseapp.com",
  projectId: "appli-de-suivis-repas",
  storageBucket: "appli-de-suivis-repas.firebasestorage.app",
  messagingSenderId: "284665491645",
  appId: "1:284665491645:web:e935e754a9b3bdd44347d4"
};

let auth = null, db = null, currentUser = null;
if (FIREBASE_CONFIG && window.firebase) {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth(); auth.languageCode = 'fr';
  db = firebase.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch(e => console.warn('Persistance hors-ligne indisponible :', e.code));
}
const CLOUD = !!db;

/* ============================== 2. OUTILS ============================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const r0 = v => Math.round(v);
const fr = (v, d = 0) => Number(v).toLocaleString('fr-FR', { maximumFractionDigits: d });
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const pad = n => String(n).padStart(2, '0');
const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const shiftDay = (k, n) => { const [y, m, d] = k.split('-').map(Number); return dateKey(new Date(y, m - 1, d + n)); };
const dayLabel = k => {
  const t = dateKey();
  if (k === t) return "Aujourd'hui";
  if (k === shiftDay(t, -1)) return 'Hier';
  if (k === shiftDay(t, 1)) return 'Demain';
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
};
const MEALS = [['pdj', 'Petit-déjeuner'], ['dej', 'Déjeuner'], ['diner', 'Dîner'], ['collation', 'Collation']];
const MEAL_NAME = Object.fromEntries(MEALS);
const defaultMeal = () => { const h = new Date().getHours() + new Date().getMinutes() / 60; return h < 10.5 ? 'pdj' : h < 15 ? 'dej' : h < 18 ? 'collation' : 'diner'; };
const PLACES = [['frigo', 'Frigo', '🧊'], ['congel', 'Congélateur', '❄️'], ['placard', 'Placard (sec)', '🥫']];
const PLACE_NAME = Object.fromEntries(PLACES.map(p => [p[0], p[1]]));
const RTYPES = { pdj: 'Petit-déj', plat: 'Plat', collation: 'Collation' };
let toastT;
const toast = msg => { let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); };

/* ============================== 3. DONNÉES & SAUVEGARDE ============================== */
const LS_KEY = 'repas-v1';
const blank = () => ({
  profile: { sex: 'h', age: 30, height: 175, weight: 75, activity: 1.55, goal: 'maintien', persons: 1, custom: null },
  stock: [],        // { id, ing, qty, place }  ou plat en boîte : { id, dish: { name, n }, qty (portions), place }
  customIngs: [],   // ingrédients créés ou corrigés (même forme que INGREDIENTS)
  days: {},         // 'AAAA-MM-JJ' → [ { id, meal, name, kcal, p, g, l } ]
  ticketMap: {},    // nom sur le ticket Super U → id d'ingrédient (ou '__ignore')
});
let S = blank();
const UI = { tab: 'today', day: dateKey(), rFilter: 'all', rSearch: '', persons: null, sSearch: '' };

function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) { console.warn(e); }
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { console.warn(e); } }

let saveT = null, syncState = 'idle';
function save() {
  saveLocal();
  if (!CLOUD || !currentUser) return;
  clearTimeout(saveT); setSync('busy');
  saveT = setTimeout(() => {
    db.collection('users').doc(currentUser.uid)
      .set({ profile: S.profile, stock: S.stock, customIngs: S.customIngs, ticketMap: S.ticketMap, updatedAt: Date.now() })
      .then(() => setSync('on')).catch(e => { console.error(e); setSync('err'); toast('Erreur de synchro : ' + e.code); });
  }, 600);
}
// Journal : chaque ajout / suppression va directement dans le document du jour (sans écraser l'autre appareil)
function addEntry(day, e) {
  (S.days[day] ||= []).push(e); saveLocal();
  if (CLOUD && currentUser) db.collection('users').doc(currentUser.uid).collection('days').doc(day)
    .set({ entries: firebase.firestore.FieldValue.arrayUnion(e) }, { merge: true }).catch(err => toast('Erreur : ' + err.code));
}
function removeEntry(day, id) {
  const list = S.days[day] || [], e = list.find(x => x.id === id); if (!e) return;
  S.days[day] = list.filter(x => x.id !== id); saveLocal();
  if (CLOUD && currentUser) db.collection('users').doc(currentUser.uid).collection('days').doc(day)
    .update({ entries: firebase.firestore.FieldValue.arrayRemove(e) }).catch(err => toast('Erreur : ' + err.code));
}
function setSync(s) {
  syncState = s;
  $('sync').innerHTML = !CLOUD ? '<span class="dot"></span>Local'
    : s === 'busy' ? '<span class="dot busy"></span>Synchro…'
    : s === 'err' ? '<span class="dot" style="background:var(--bad)"></span>Erreur'
    : '<span class="dot on"></span>Synchronisé';
}

let unsubMain = null, unsubDay = null;
function listenCloud() {
  const ref = db.collection('users').doc(currentUser.uid);
  unsubMain = ref.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (!snap.exists) { save(); return; }   // premier lancement : on envoie ce qu'on a en local
    const d = snap.data();
    S.profile = Object.assign(blank().profile, d.profile || {});
    S.stock = d.stock || []; S.customIngs = d.customIngs || []; S.ticketMap = d.ticketMap || {};
    saveLocal(); setSync('on'); render();
  }, e => { console.error(e); setSync('err'); });
  listenDay();
}
function listenDay() {
  if (!CLOUD || !currentUser) return;
  if (unsubDay) unsubDay();
  const day = UI.day;
  unsubDay = db.collection('users').doc(currentUser.uid).collection('days').doc(day).onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    S.days[day] = snap.exists ? (snap.data().entries || []) : (S.days[day] || []);
    saveLocal(); if (UI.tab === 'today') render();
  });
}

/* ============================== 4. CALCULS ============================== */
// --- Ingrédients ---
function ingMap() {
  const m = {}; for (const i of INGREDIENTS) m[i.id] = i;
  for (const i of S.customIngs) m[i.id] = Object.assign({}, m[i.id] || {}, i);
  return m;
}
let ING = ingMap();
const ingOf = id => ING[id] || { id, name: id, unit: 'g', place: 'placard', n: { kcal: 0, p: 0, g: 0, l: 0 } };
const allIngs = () => Object.values(ING).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
const unitLbl = u => u === 'pc' ? '' : u;

function fmtQty(ingId, q) {
  const i = ingOf(ingId);
  if (i.unit === 'pc') {
    const fr4 = { 0.25: '¼', 0.5: '½', 0.75: '¾' }, w = Math.floor(q + 1e-9), f = Math.round((q - w) * 4) / 4;
    const s = f > 0 && fr4[f] ? (w ? w + ' ' : '') + fr4[f] : fr(q, 1);
    return s + (q > 1 ? ' pièces' : ' pièce');
  }
  let s = q >= 1000 ? fr(q / 1000, 2) + (i.unit === 'ml' ? ' L' : ' kg') : fr(q, q < 10 ? 1 : 0) + ' ' + i.unit;
  if (i.pw && i.unit === 'g' && q >= i.pw * 0.75) s += ` <span class="mute">(≈${fr(q / i.pw, 1)})</span>`;
  return s;
}
// Valeurs nutritionnelles d'une quantité d'ingrédient
function nutrOf(ingId, q) {
  const i = ingOf(ingId), f = i.unit === 'pc' ? q * (i.pw || 100) / 100 : q / 100;
  return { kcal: i.n.kcal * f, p: i.n.p * f, g: i.n.g * f, l: i.n.l * f };
}
const addN = (a, b, k = 1) => ({ kcal: a.kcal + b.kcal * k, p: a.p + b.p * k, g: a.g + b.g * k, l: a.l + b.l * k });
const ZERO = () => ({ kcal: 0, p: 0, g: 0, l: 0 });

// --- Stock ---
const matches = (it, ingId) => !it.dish && (it.ing === ingId || ingOf(it.ing).fam === ingId);
const available = ingId => S.stock.filter(it => matches(it, ingId)).reduce((s, it) => s + it.qty, 0);
const PLACE_ORDER = { frigo: 0, congel: 1, placard: 2 };
function deduct(ingId, qty) {
  const items = S.stock.filter(it => matches(it, ingId))
    .sort((a, b) => (a.ing === ingId ? 0 : 1) - (b.ing === ingId ? 0 : 1) || PLACE_ORDER[a.place] - PLACE_ORDER[b.place]);
  let left = qty;
  for (const it of items) { if (left <= 0) break; const t = Math.min(it.qty, left); it.qty -= t; left -= t; }
  S.stock = S.stock.filter(it => it.qty > 1e-6);
}
function addStock(ingId, qty, place) {
  const ex = S.stock.find(it => !it.dish && it.ing === ingId && it.place === place);
  if (ex) ex.qty += qty; else S.stock.push({ id: uid(), ing: ingId, qty, place });
}

// --- Recettes ---
const allRecipes = () => RECIPES;
// État d'une recette pour N personnes : ingrédients présents / manquants, valeurs par portion
function recipeState(r, persons) {
  let need = 0, have = 0, n = ZERO();
  const lines = r.ings.map(x => {
    const i = ingOf(x.ing), q = x.q * persons, av = i.base ? Infinity : available(x.ing);
    const ok = i.base || av >= q - 1e-6, partial = !ok && av > 0;
    const used = !x.opt || av > 0;   // un facultatif ne compte que si on l'a
    if (used) n = addN(n, nutrOf(x.ing, x.q));
    if (!x.opt && !i.base) { need++; if (ok) have++; }
    return { ...x, i, q, av, ok, partial, base: !!i.base, used };
  });
  const missing = lines.filter(l => !l.opt && !l.ok);
  return { lines, missing, ratio: need ? have / need : 1, ok: missing.length === 0, n };
}

// --- Profil & objectifs ---
const GOALS = { perte: ['Perte de poids', -0.15, 2.0], maintien: ['Maintien', 0, 1.6], masse: ['Prise de masse', 0.10, 1.8] };
const ACTIVITIES = [[1.2, 'Sédentaire (peu ou pas de sport)'], [1.375, 'Légère (1–3 séances / semaine)'], [1.55, 'Modérée (3–5 séances / semaine)'], [1.725, 'Élevée (6–7 séances / semaine)'], [1.9, 'Très élevée (travail physique + sport)']];
function targets(p = S.profile) {
  const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'f' ? -161 : 5);   // Mifflin-St Jeor
  const tdee = bmr * p.activity, [, adj, pkg] = GOALS[p.goal] || GOALS.maintien;
  const kcal = tdee * (1 + adj), prot = pkg * p.weight, lip = kcal * 0.30 / 9, glu = Math.max(0, (kcal - prot * 4 - lip * 9) / 4);
  const auto = { kcal: r0(kcal), p: r0(prot), g: r0(glu), l: r0(lip) };
  return { bmr: r0(bmr), tdee: r0(tdee), auto, t: p.custom ? Object.assign({}, auto, p.custom) : auto };
}
const dayTotals = day => (S.days[day] || []).reduce((a, e) => addN(a, e), ZERO());

let sheetClose = null;
function openSheet(html, onMount) {
  const root = $('sheet-root');
  root.innerHTML = `<div class="backdrop"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  const bd = root.firstChild;
  bd.addEventListener('click', e => { if (e.target === bd) closeSheet(); });
  if (onMount) onMount(bd.querySelector('.sheet'));
}
function closeSheet() { $('sheet-root').innerHTML = ''; }
const sheetHead = t => `<div class="sheet-h"><h2>${esc(t)}</h2><button class="icon-btn" data-act="close" aria-label="Fermer">×</button></div>`;

// --- Choisir un ingrédient (recherche) ---
function ingPicker(sh, { onPick, filter = i => !i.base, showStock = false }) {
  const inp = sh.querySelector('.ip-search'), res = sh.querySelector('.results');
  const draw = () => {
    const q = norm(inp.value.trim());
    const list = allIngs().filter(filter).filter(i => !q || norm(i.name).includes(q)).slice(0, 60);
    res.innerHTML = list.map(i => `<div class="res" data-id="${esc(i.id)}"><div class="grow">${esc(i.name)}<div class="tiny mute">${PLACE_NAME[i.place]}${showStock && available(i.id) ? ' · en stock : ' + fmtQty(i.id, available(i.id)) : ''}</div></div><span class="tiny mute">${r0(i.n.kcal)} kcal${i.unit === 'pc' ? '/pce' : '/100' + i.unit}</span></div>`).join('')
      + `<div class="res" data-new="1"><div class="grow" style="color:var(--acc)">+ Créer « ${esc(inp.value.trim() || 'nouvel ingrédient')} »</div></div>`;
  };
  inp.addEventListener('input', draw);
  res.addEventListener('click', e => {
    const r = e.target.closest('.res'); if (!r) return;
    if (r.dataset.new) return sheetIngredient(null, inp.value.trim(), created => onPick(created.id));
    onPick(r.dataset.id);
  });
  draw(); setTimeout(() => inp.focus(), 50);
}

// --- Saisie d'une quantité (avec choix g / pièces) ---
function qtyField(ingId, val) {
  const i = ingOf(ingId), canPc = i.unit !== 'pc' && i.pw;
  return `<label class="f">Quantité</label><div class="row">
    <input type="number" inputmode="decimal" step="any" class="q-in" value="${val ?? ''}" placeholder="${i.unit === 'pc' ? 'nombre' : 'ex. ' + (i.unit === 'ml' ? '500' : '200')}">
    ${canPc ? `<div class="seg" style="flex:none"><button class="on" data-u="base">${i.unit}</button><button data-u="pc">pièce(s)</button></div>` : `<span class="mute" style="flex:none">${i.unit === 'pc' ? 'pièce(s)' : i.unit}</span>`}
  </div>${canPc ? `<div class="tiny mute" style="margin-top:4px">1 pièce ≈ ${i.pw} g</div>` : ''}`;
}
function readQty(sh, ingId) {
  const i = ingOf(ingId), v = num(sh.querySelector('.q-in').value), u = sh.querySelector('.seg button.on[data-u]');
  return u && u.dataset.u === 'pc' ? v * i.pw : v;

function wireSeg(sh) {
  sh.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !seg.contains(b)) return;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));

}

// --- Ajouter au stock ---
function sheetAddStock() {
  openSheet(`${sheetHead('Ajouter au stock')}<input type="search" class="ip-search" placeholder="Chercher un ingrédient (poulet, pâtes…)"><div class="results" style="margin-top:8px"></div>`,
    sh => ingPicker(sh, { onPick: id => sheetStockQty(id), showStock: true }));

function sheetStockQty(ingId) {
  const i = ingOf(ingId);
  openSheet(`${sheetHead(i.name)}
    ${qtyField(ingId)}
    <label class="f">Rangement</label>
    <div class="seg" id="pl">${PLACES.map(([k, l]) => `<button data-p="${k}" class="${i.place === k ? 'on' : ''}">${l.split(' ')[0]}</button>`).join('')}</div>

    wireSeg(sh);
    const go = () => {
      const q = readQty(sh, ingId); if (q <= 0) return toast('Indique une quantité');
      addStock(ingId, q, sh.querySelector('#pl button.on').dataset.p); save();
      toast(`${i.name} ajouté`); sheetAddStock(); render();
    };
    sh.querySelector('#ok').onclick = go;
    sh.querySelector('.q-in').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    setTimeout(() => sh.querySelector('.q-in').focus(), 50);

function sheetEditStock(id) {
  const it = S.stock.find(x => x.id === id); if (!it) return;
  const name = it.dish ? it.dish.name : ingOf(it.ing).name;
  openSheet(`${sheetHead(name)}
    ${it.dish ? `<label class="f">Portions</label><input type="number" inputmode="decimal" class="q-in" value="${it.qty}">` : qtyField(it.ing, +it.qty.toFixed(1))}
    <label class="f">Rangement</label>
    <div class="seg" id="pl">${PLACES.map(([k, l]) => `<button data-p="${k}" class="${it.place === k ? 'on' : ''}">${l.split(' ')[0]}</button>`).join('')}</div>
    <div class="row" style="gap:8px;margin-top:16px"><button class="btn danger" id="del">Supprimer</button><button class="btn pri grow" id="ok">Enregistrer</button></div>`, sh => {
    wireSeg(sh);
    sh.querySelector('#ok').onclick = () => {
      const q = it.dish ? num(sh.querySelector('.q-in').value) : readQty(sh, it.ing);
      it.qty = q; it.place = sh.querySelector('#pl button.on').dataset.p;
      S.stock = S.stock.filter(x => x.qty > 1e-6); save(); closeSheet(); render();
    };
    sh.querySelector('#del').onclick = () => { S.stock = S.stock.filter(x => x.id !== id); save(); closeSheet(); render(); };
  });
}

function sheetIngredient(id, presetName = '', onDone) {

const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function loadPdfJs() {
  if (window.pdfjsLib) return;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js'; s.onload = res; s.onerror = () => rej(new Error('pdf.js')); document.head.appendChild(s); });
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
}
// Reconstitue les lignes du PDF (les morceaux de texte qui ont la même hauteur)
async function pdfToText(file) {
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise, out = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const items = (await (await pdf.getPage(n)).getTextContent()).items.filter(i => i.str.trim());
    const rows = [];
    for (const it of items) {
      const y = it.transform[5], x = it.transform[4];
      let row = rows.find(r => Math.abs(r.y - y) < 2.5);
      if (!row) rows.push(row = { y, parts: [] });
      row.parts.push({ x, s: it.str });
    }
    rows.sort((a, b) => b.y - a.y).forEach(r => out.push(r.parts.sort((a, b) => a.x - b.x).map(p => p.s).join(' ').replace(/\s+/g, ' ').trim()));
  }
  return out.join('\n');
}
// Lit le texte du ticket : rayons, produits, prix, code TVA (11 = alimentaire, 13 = non alimentaire), quantités
function parseTicket(text) {
  const lines = text.split(/\r?\n/).map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  let i = lines.findIndex(l => /\*\*\*\s*VENTE\s*\*\*\*/i.test(l)); i = i < 0 ? 0 : i + 1;
  const items = []; let cat = '';
  for (; i < lines.length; i++) {
    const l = lines[i];
    if (/^(Nombre de lignes|TOTAL\b|SOUS-TOTAL)/i.test(l)) break;
    let m;
    if ((m = l.match(/^(.+?)\s+(-?\d+,\d{2})\s*€?\s+(\d{1,2})$/))) items.push({ label: m[1].trim(), total: num(m[2]), tva: m[3], count: 1, cat });
    else if ((m = l.match(/^(\d+)\s*x\s+[\d,]+\s*(EUR|€)/i)) && items.length) items[items.length - 1].count = +m[1];
    else if ((m = l.match(/^([\d,]+)\s*kg\s*x/i)) && items.length) items[items.length - 1].kg = num(m[1]);
    else if (!/\d,\d{2}/.test(l) && /^[A-Z0-9 .,'&()\/-]+$/.test(l)) cat = l;
  }
  return items;
}
// Contenance d'un produit à partir de son nom : « 4X150G », « 6X1L », « X10 », « 500G », « 1,25L », « BOITE 4/4 »
function parseSize(label) {
  const L = label.toUpperCase().replace(/(\d),(\d)/g, '$1.$2');
  const toBase = (v, u) => v * ({ KG: 1000, G: 1, L: 1000, CL: 10, ML: 1 }[u]);
  let m = L.match(/(\d+)\s*X\s*(\d+(?:\.\d+)?)\s*(KG|G|CL|ML|L)\b/);
  if (m) return { size: +m[1] * toBase(+m[2], m[3]), pieces: +m[1] };
  const all = [...L.matchAll(/(\d+(?:\.\d+)?)\s*(KG|G|CL|ML|L)\b/g)], pc = L.match(/\bX\s?(\d+)\b/);
  const size = all.length ? toBase(+all[all.length - 1][1], all[all.length - 1][2]) : /\b4\/4\b/.test(L) ? 800 : null;
  return { size, pieces: pc ? +pc[1] : null };
}

const ticketKey = label => label.toUpperCase().replace(/\s+/g, ' ').trim();
// Renvoie { ing, how } : how = 'memo' (déjà choisi), 'regle' (reconnu), 'devine' (approché : à vérifier)
function guessIng(label, cat) {
  const k = ticketKey(label);
  const m = S.ticketMap[k];   // seuls tes choix manuels sont mémorisés ('__skip' = ne pas suivre)
  if (m && m !== '__ignore') return { ing: m === '__skip' ? '' : m, how: 'memo' };
  const raw = norm(label).toUpperCase(), s = raw + ' | ' + expandLabel(raw), c = norm(cat).toUpperCase();
  for (const [re, id] of TICKET_RULES) if (re.test(s)) return { ing: typeof id === 'function' ? id(s, c) : id, how: 'regle' };
  // Dernier recours : mots en commun avec le nom d'un ingrédient (≥ 5 lettres)
  const words = expandLabel(raw).split(' ').filter(w => w.length >= 5);
  let best = null, score = 0;
  for (const i of allIngs()) {
    const iw = norm(i.name).toUpperCase().split(/[^A-Z]+/).filter(w => w.length >= 5);
    const sc = words.filter(w => iw.some(x => x.slice(0, 5) === w.slice(0, 5))).length;
    if (sc > score) { score = sc; best = i.id; }
  }
  return best ? { ing: best, how: 'devine' } : { ing: '', how: '' };
}
function ticketQty(ingId, it) {
  const i = ingOf(ingId), pk = parseSize(it.label), n = it.count || 1;
  if (it.kg) return i.unit === 'pc' && i.pw ? Math.round(it.kg * 1000 / i.pw) : it.kg * 1000;
  if (i.unit === 'pc') return pk.pieces ? pk.pieces * n : pk.size && i.pw ? Math.max(1, Math.round(pk.size / i.pw)) * n : n;
  if (pk.size) return pk.size * n;
  if (pk.pieces && i.pw) return pk.pieces * i.pw * n;
  return i.pw ? i.pw * n : 0;
}
let IMPORT = null;   // { rows: [ { label, cat, count, ing, qty, place, on } ], skipped: [] }
function buildImport(text) {
  const items = parseTicket(text);
  const food = items.filter(it => it.tva !== '13' && it.total > 0), skipped = items.filter(it => it.tva === '13');
  const rows = food.map(it => {
    const { ing, how } = guessIng(it.label, it.cat), i = ing && ingOf(ing);
    return { ...it, ing, how, qty: ing ? ticketQty(ing, it) : 0,
      place: /SURGEL/i.test(norm(it.cat)) ? 'congel' : i ? i.place : 'frigo', on: !!ing && !(i && i.base) };
  });
  // à vérifier d'abord (devinés), puis reconnus, puis ingrédients de base, puis non suivis
  const rank = r => r.how === 'devine' && r.ing ? 0 : r.on ? 1 : r.ing ? 2 : 3;
  rows.sort((a, b) => rank(a) - rank(b));
  IMPORT = { rows, skipped };
}
function sheetImport() {
  openSheet(`${sheetHead('Importer un ticket')}
    <p class="small mute" style="margin-top:0">Ticket de caisse Super U en PDF (livraison ou magasin). L'appli reconnaît les produits, les quantités et le rangement ; tu vérifies avant d'ajouter.</p>
    <label class="btn pri full">📄 Choisir le PDF du ticket<input type="file" accept="application/pdf,.pdf" id="t-file" hidden></label>
    <div id="t-msg" class="small" style="margin-top:10px"></div>
    <details style="margin-top:14px"><summary class="small" style="cursor:pointer">Pas de PDF ? Coller le texte du ticket</summary>
      <textarea id="t-text" rows="8" style="width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)" placeholder="Colle ici le contenu du ticket ou de l'e-mail de commande"></textarea>
      <button class="btn full" id="t-go" style="margin-top:8px">Analyser le texte</button></details>`, sh => {
    const done = text => {
      buildImport(text);
      if (!IMPORT.rows.length) { sh.querySelector('#t-msg').innerHTML = '<span style="color:var(--bad)">Aucun produit trouvé. Est-ce bien un ticket Super U ?</span>'; return; }
      sheetImportReview();
    };
    sh.querySelector('#t-file').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      sh.querySelector('#t-msg').textContent = 'Lecture du ticket…';
      try { done(await pdfToText(f)); } catch (err) { console.error(err); sh.querySelector('#t-msg').innerHTML = '<span style="color:var(--bad)">Impossible de lire ce PDF. Essaie de coller le texte.</span>'; }
    });
    sh.querySelector('#t-go').onclick = () => done(sh.querySelector('#t-text').value);
  });
}
function sheetImportReview() {
  const prev = document.querySelector('.sheet'), keep = prev && prev.querySelector('#t-add') ? prev.scrollTop : 0;
  const opts = allIngs().map(i => `<option value="${esc(i.id)}">${esc(i.name)}</option>`).join('');
  const nOn = IMPORT.rows.filter(r => r.on && r.ing && r.qty > 0).length, nGuess = IMPORT.rows.filter(r => r.ing && r.how === 'devine').length;
  openSheet(`${sheetHead('Vérifier le ticket')}
    <p class="small mute" style="margin-top:0">${IMPORT.rows.length} produits alimentaires${IMPORT.skipped.length ? ` · ${IMPORT.skipped.length} non alimentaires ignorés` : ''}.
      ${nGuess ? `<b>${nGuess} à vérifier</b> (en haut).` : ''} L'appli retiendra tes choix pour les prochains tickets.</p>
    ${IMPORT.rows.map((r, k) => { const i = r.ing && ingOf(r.ing), first = !r.ing && (k === 0 || IMPORT.rows[k - 1].ing); return `${first ? '<h2>Non suivis</h2><p class="small mute" style="margin-top:-4px">Choisis un ingrédient pour les suivre, sinon ils seront ignorés.</p>' : ''}<div class="card" style="padding:10px 12px;margin-bottom:8px;${r.on ? '' : 'opacity:.6'}">
      <div class="row"><input type="checkbox" data-k="${k}" class="t-on" ${r.on ? 'checked' : ''} ${r.ing ? '' : 'disabled'}>
        <div class="grow tiny mute" style="word-break:break-word">${esc(r.label)}${r.count > 1 ? ` <b>× ${r.count}</b>` : ''}${r.kg ? ` <b>${fr(r.kg, 3)} kg</b>` : ''}</div>
        ${r.ing && r.how === 'devine' ? '<span class="badge warn">à vérifier</span>' : r.how === 'memo' && r.ing && !r.touched ? '<span class="badge ok">mémorisé</span>' : ''}</div>
      <select class="t-ing" data-k="${k}" style="margin-top:6px"><option value="">— Ne pas suivre —</option><option value="__new">+ Créer un ingrédient…</option>${opts}</select>
      ${r.ing ? (i.base ? `<div class="tiny mute" style="margin-top:6px">Ingrédient de base : toujours dispo, pas besoin de l'ajouter.</div>` : `<div class="row" style="margin-top:6px;gap:6px">
        <input type="number" inputmode="decimal" step="any" class="t-qty" data-k="${k}" value="${+(+r.qty).toFixed(1)}" style="flex:1">
        <span class="small mute" style="flex:none">${i.unit === 'pc' ? 'pièce(s)' : i.unit}</span>
        <select class="t-place" data-k="${k}" style="flex:1.3">${PLACES.map(([pk, pl]) => `<option value="${pk}" ${r.place === pk ? 'selected' : ''}>${pl.split(' ')[0]}</option>`).join('')}</select></div>`) : ''}
    </div>`; }).join('')}
    <button class="btn pri full" id="t-add" style="position:sticky;bottom:0" ${nOn ? '' : 'disabled'}>Ajouter ${nOn} produit${nOn > 1 ? 's' : ''} au stock</button>`, sh => {
    sh.querySelectorAll('.t-ing').forEach(sel => { const r = IMPORT.rows[sel.dataset.k]; sel.value = r.ing || ''; });
    sh.scrollTop = keep;
    sh.addEventListener('change', e => {
      const t = e.target, r = IMPORT.rows[t.dataset.k]; if (!r) return;
      if (t.classList.contains('t-on')) { r.on = t.checked; return sheetImportReview(); }
      if (t.classList.contains('t-qty')) { r.qty = num(t.value); return; }
      if (t.classList.contains('t-place')) { r.place = t.value; return; }
      if (t.classList.contains('t-ing')) {
        if (t.value === '__new') {
          const pretty = r.label.toLowerCase().replace(/\b\d.*$/, '').replace(/\./g, ' ').replace(/\s+/g, ' ').trim();
          return sheetIngredient(null, pretty.charAt(0).toUpperCase() + pretty.slice(1), created => { setRowIng(r, created.id); sheetImportReview(); });
        }
        setRowIng(r, t.value); sheetImportReview();
      }
    });
    sh.querySelector('#t-add').onclick = () => {
      let n = 0;
      for (const r of IMPORT.rows) {
        if (r.touched) S.ticketMap[ticketKey(r.label)] = r.ing || '__skip';
        if (r.on && r.ing && r.qty > 0 && !ingOf(r.ing).base) { addStock(r.ing, r.qty, r.place); n++; }
      }
      IMPORT = null; save(); closeSheet(); UI.tab = 'stock'; render(); toast(`${n} produit${n > 1 ? 's' : ''} ajouté${n > 1 ? 's' : ''} au stock`);
    };
  });
}
function setRowIng(r, id) {
  r.ing = id; r.how = 'memo'; r.touched = true; if (!id) { r.on = false; r.qty = 0; return; }
  const i = ingOf(id); r.qty = ticketQty(id, r); r.on = !i.base;
  if (!/SURGEL/i.test(norm(r.cat))) r.place = i.place;
}

/* ============================== ÉVÉNEMENTS ============================== */
document.addEventListener('click', e => {
  const tab = e.target.closest('#tabs button');
  if (tab) { UI.tab = tab.dataset.tab; window.scrollTo(0, 0); return render(); }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'close': return closeSheet();
    case 'day': UI.day = shiftDay(UI.day, +el.dataset.n); listenDay(); return render();
    case 'add-entry': return sheetAddEntry();
    case 'entry-mode': return sheetAddEntry(el.dataset.m);
    case 'del-entry': removeEntry(UI.day, id); return render();
    case 'eat-box': return sheetEatBox(id);
    case 'go-ideas': UI.tab = 'recipes'; UI.rFilter = 'ok'; return render();
    case 'add-stock': return sheetAddStock();
    case 'import-ticket': return sheetImport();
    case 'edit-stock': return sheetEditStock(id);
    case 'qty': {
      const it = S.stock.find(x => x.id === id); if (!it) return;
      it.qty = Math.max(0, it.qty + stepOf(it) * +el.dataset.d);
      S.stock = S.stock.filter(x => x.qty > 1e-6); save(); return render();
    }
    case 'persons': UI.persons = Math.max(1, (UI.persons ?? S.profile.persons ?? 1) + +el.dataset.d); return render();
    case 'rfilter': UI.rFilter = el.dataset.f; return render();
    case 'open-recipe': return sheetRecipe(id);
    case 'pf-seg': S.profile[el.dataset.k] = el.dataset.v; save(); return render();
    case 'custom-tg': S.profile.custom = el.checked ? { ...targets().auto } : null; save(); return render();
    case 'new-ing': return sheetIngredient(null);
    case 'edit-ing': return sheetIngredient(id);
    case 'pick-edit-ing': return openSheet(`${sheetHead('Corriger un ingrédient')}<input type="search" class="ip-search" placeholder="Chercher"><div class="results" style="margin-top:8px"></div>`,
      sh => ingPicker(sh, { onPick: iid => sheetIngredient(iid), filter: () => true }));
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
      const url = URL.createObjectURL(blob), lnk = document.createElement('a');
      lnk.href = url; lnk.download = `mes-repas-${dateKey()}.json`; lnk.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); return;
    }
    case 'logout': if (confirm('Se déconnecter ?')) auth.signOut(); return;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 's-search') { UI.sSearch = t.value; const pos = t.selectionStart; render(); const n = $('s-search'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.id === 'r-search') { UI.rSearch = t.value; const pos = t.selectionStart; render(); const n = $('r-search'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pf) { const k = t.dataset.pf; S.profile[k] = num(t.value) || blank().profile[k]; save(); render(); }
  if (t.dataset.tg && S.profile.custom) { S.profile.custom[t.dataset.tg] = num(t.value); save(); render(); }
  if (t.id === 'import-file' && t.files[0]) {
    t.files[0].text().then(txt => {
      const d = JSON.parse(txt); if (!d.profile || !Array.isArray(d.stock)) throw new Error('format');
      if (!confirm('Remplacer tes données actuelles par celles du fichier ?')) return;
      S = Object.assign(blank(), d); save();
      if (CLOUD && currentUser) Object.entries(S.days).forEach(([k, v]) => db.collection('users').doc(currentUser.uid).collection('days').doc(k).set({ entries: v }));
      toast('Données importées'); render();
    }).catch(() => toast('Fichier invalide'));
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function showLogin() {

  $('view').innerHTML = `<div class="card login"><h3>Connexion</h3>
    <p class="small mute" style="margin-top:0">Connecte-toi pour retrouver ton stock et ton suivi sur tous tes appareils.</p>
    <label class="f">E-mail</label><input type="email" id="l-mail" autocomplete="email">

    <div class="small" id="l-err" style="color:var(--bad);margin-top:8px"></div>

  const go = up => {

  };
  $('l-in').onclick = () => go(false); $('l-up').onclick = () => go(true);
}
function start() {

    currentUser = u;

  });

start();
